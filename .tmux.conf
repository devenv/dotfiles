set-option -g allow-rename on
set-option -g prefix `
set-option -g prefix2 M-Space
set-option -g status-bg colour235
set-option -g status-fg colour136

set -g @fpp-key 'f'
set -g @fpp-path '/opt/homebrew/bin/fpp'
set -g base-index 1
set -g default-terminal "xterm-256color"
set -g display-time 4000
set -g focus-events on
set -g history-limit 250000
set -g mouse off
set -g pane-base-index 1
set -g visual-activity on
set -g word-separators ' @"=()[]{}.,/'
set -g xterm-keys on
set -sg escape-time 0
setw -g aggressive-resize off
setw -g alternate-screen on
setw -g mode-keys vi
setw -g monitor-activity off
setw -g monitor-silence 0
# Enable activity monitoring and notifications for background sessions automatically
set-hook -g session-created 'run-shell "/Users/devenv/.tmux/scripts/monitor-background.sh"'
set-hook -g client-attached 'run-shell "/Users/devenv/.tmux/scripts/monitor-background.sh"'
set-hook -g client-detached 'run-shell "/Users/devenv/.tmux/scripts/monitor-background.sh"'

unbind -n C-b
unbind -n C-j
unbind -n C-k
unbind -n Pageup
unbind -n Pagedown
unbind -n z
unbind -T prefix C-Left
unbind -n M-Left
unbind -n M-Right

bind-key ` send-prefix

bind S setw synchronize-panes
bind a setw monitor-activity toggle

bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

unbind-key -T copy-mode-vi v
bind u run ~/bin/tmux-url-select.pl
bind-key -T copy-mode-vi 'v' send -X rectangle-toggle
bind-key -Tcopy-mode-vi 'y' send -X copy-selection
bind-key -Tcopy-mode-vi M-s send-keys Pageup
bind-key -Tcopy-mode-vi M-d send-keys Pagedown

bind n command-prompt "rename-window '%%'"

bind -n M-o split-window -c "#{pane_current_path}"
bind -n M-O split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}" \; set-window-option -t . monitor-activity off \; set-window-option -t . monitor-silence 0
bind Tab next-window
bind -n M-e next-window
bind -n M-n next-window
bind -n M-q previous-window
bind -n M-N previous-window
bind-key m choose-window 'join-pane -t "%%"'

# Park and unpark window shortcuts
# M-A parks current window, or unparks the current window from parking
bind -n M-A run -b 'if [ "#{session_name}" = "parking" ]; then current_window="#{window_index}"; next_index=`tmux list-windows -t 0 -F "#{window_index}" | tail -1 | awk "{print \\$1+1}"`; tmux new-session -d -s 0 2>/dev/null; tmux move-window -s "parking:$current_window" -t "0:$next_index" && tmux switch-client -t "0:$next_index"; else tmux new-session -d -s parking 2>/dev/null; tmux set-window-option -t parking monitor-activity 0; tmux set-window-option -t parking monitor-silence 0; tmux move-window -s "#{session_name}:#{window_index}" -t "parking"; fi'

# M-a moves windows from parking to session 0, or switches to parking if not in parking
bind -n M-a run-shell -b "/Users/devenv/.tmux/scripts/unpark.sh"

bind -n M-= select-layout even-vertical
bind -n M-_ select-layout even-vertical
bind-key / copy-mode \; send-key ?
bind-key -n M-x copy-mode
bind-key -n M-s copy-mode\; send-keys Pageup
bind-key -n M-d copy-mode\; send-keys Pagedown
bind-key -n M-z resize-pane -Z
bind-key Space resize-pane -Z
bind-key M-Space resize-pane -Z

# M-u toggles activity monitoring (monitor-activity)
bind-key -n M-u if-shell 'tmux show-window-options -v monitor-activity | grep -q on' 'set-window-option -t . monitor-activity off; refresh-client -S' 'set-window-option -t . monitor-activity on; refresh-client -S'

# M-i toggles inactivity monitoring (monitor-silence) - 0 disables, 10 enables
bind-key -n M-i if-shell 'tmux show-window-options -v monitor-silence | grep -q "^0$"' 'set-window-option -t . monitor-silence 10; refresh-client -S' 'set-window-option -t . monitor-silence 0; refresh-client -S'

# Refresh status when switching windows to reset activity display and clear activity flag
set-hook -g window-pane-changed 'select-window -t . ; refresh-client -S'

# Refresh status line every 60 seconds (minimal polling, git hooks handle updates)
set -g status-interval 60

# Alert hooks disabled - they cause slowness
# set-hook -g alert-activity 'refresh-client -S'
# set-hook -g alert-silence 'refresh-client -S'

bind | select-layout even-horizontal
bind -n M-w select-pane -U\; resize-pane -Z
# bind -n M-e copy-mode \; send -X search-backward "Traceback"\; #send-keys -X -N 10 scroll-down

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -D 10
bind -n M-K resize-pane -U 10
bind -n M-L resize-pane -R 10

bind J swap-pane -D
bind K swap-pane -U
bind b break-pane

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

set -g @catppuccin_flavour 'mocha'

set -g @catppuccin_status_modules_right "date_time"
set -g @catppuccin_status_modules_left ""

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status_icon_enable "yes"

set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator ""

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator " █"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"

set -g @catppuccin_date_time_color "blue"

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S "
set -g @catppuccin_window_default_text '#(sh ~/.tmux/scripts/window-name.sh "#{pane_current_path}" "#{window_activity_flag}" "#{window_silence_flag}" "#{window_index}")'
set -g @catppuccin_window_current_text '#(sh ~/.tmux/scripts/window-name.sh "#{pane_current_path}" "#{window_activity_flag}" "#{window_silence_flag}" "#{window_index}")'

set -g @catppuccin_icon_window_last "󰖰"
set -g @catppuccin_icon_window_current "󰖯"
set -g @catppuccin_icon_window_zoom " 󰁌"
set -g @catppuccin_icon_window_mark " 󰃀"
set -g @catppuccin_icon_window_silent " 󰂛"
set -g @catppuccin_icon_window_activity "󰖲"
set -g @catppuccin_icon_window_bell " 󰂞"

# Background session (like parking, but for panes)
# M-B sends current pane to background session (or moves it back to session 0 if already in background)
bind -n M-B run-shell -b "/Users/devenv/.tmux/scripts/send-to-floating.sh"

# M-b switches to background session (or back to session 0 if already in background)
bind -n M-b run-shell "/Users/devenv/.tmux/scripts/switch-floating.sh"

set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'jbnicolai/tmux-fpp'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @fzf-url-fzf-options '-p 60%,80% --prompt=" > "'
set -g @fzf-url-history-limit '2000'


set-environment -g PATH "/usr/local/bin:/bin:/usr/bin"
run '~/.tmux/plugins/tpm/tpm'

# Override window-status-format to show window name set by precmd hook with Catppuccin colors
# Catppuccin Mocha: Base #1e1e2e, Surface0 #313244, Sapphire #74c7ec, Overlay0 #6c7086
set-window-option -g window-status-format '#[fg=#313244,bg=#1e1e2e,nobold,nounderscore,noitalics]█#[fg=#a6adc8,bg=#313244]#{window_name}#[fg=#6c7086,bg=#313244] #I#[fg=#313244,bg=#1e1e2e]█'
set-window-option -g window-status-current-format '#[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]█#[fg=#1e1e2e,bg=#74c7ec,bold]#{window_name}#[fg=#1e1e2e,bg=#74c7ec] #I#[fg=#74c7ec,bg=#1e1e2e]█'

# set -g status-right '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
